<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Lado esquerdo -->
    <div class="left">
      <p>ESPAÇO PARA IMAGEM<br>EXCLUSIVA CADASTRO</p>
    </div>

    <!-- Lado direito -->
    <div class="right">
      <h2>Criar Nova Conta</h2>
      <p class="subtitle">Junte-se ao Acolhimento</p>

      <div class="form-box">
        <p class="form-title">FORMULÁRIO DE CADASTRO</p>

        <input type="text" placeholder="Campo Nome Completo">
        <input type="email" placeholder="Campo Email">
        <input type="password" placeholder="Campo Senha">
        <input type="password" placeholder="Confirmação de Senha">

        <button>Criar Conta</button>
      </div>

      <p class="login-link">Já tenho uma conta</p>
    </div>

  </div>

</body>
</html>
