<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    .section {
      text-align: center;
      padding: 40px 20px;
    }

    .section h1 {
      margin-bottom: 10px;
    }

    .line {
      width: 50px;
      height: 3px;
      background: #4db6ac;
      margin: 10px auto;
    }

    .map {
      width: 100%;
      height: 500px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="section">
    <h1>Contato</h1>
    <div class="line"></div>
    <p>Eric Coloque a baixo a localização final</p>
  </div>

  <div class="map">
    <iframe 
      src="https://www.google.com/maps?q=Centro+de+São+Paulo&output=embed"
      allowfullscreen=""
      loading="lazy">
    </iframe>
  </div>

</body>
</html>
