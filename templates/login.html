<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="static\login_type.css">
</head>
<body>

  <div class="container">
    
    <!-- Lado esquerdo -->
    <div class="left">
      <p>ESPAÇO PARA IMAGEM</p>
    </div>

    <!-- Lado direito -->
    <div class="right">
      <h2 class="form">Bem-vindo(a)!</h2>
      <br>
      <div class="form-box">
        <p class="form-title">Preencha seus dados para inicar sessão</p>
        <form method="post">
          <input type="email" name="email" placeholder="Campo Email">
          <input type="password" name="password" placeholder="Campo Senha">

          <!-- Linha checkbox -->
          <div class="form-options">
            <label>
              <input type="checkbox"> Lembrar
            </label>
            <a href="/forgot_password">Esqueci a senha</a>
          </div>

          <button type="submit">Entrar</button>
        </form>
      </div>
      <a href="/registrar" class="login-link">Ainda não tenho uma conta</a>
    </div>

  </div>

</body>
</html>
