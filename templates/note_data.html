<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Nota</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='clients.css') }}" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
 
  <!--Summernote-->

  <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>

  <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs4.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs4.min.js"></script>  


</head>
  <body>

      <!--Detalhes do evento-->
      <div id="popupPacient" class="popup-form-edit">
        <div class="form-content">
            <a href="/notes"><span class="close-btn" id="closePacientBtn">&times;</span></a>
            <h2>Editar nota</h2>
            <br>
            <form id="popupContactForm" method="post">
                <div class="input-group">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo" value="{{ note.titulo }}" required>
                </div>
                <div class="input-group">
                    <textarea id="summernote" name="editordata">{{ note.content }}</textarea>
                </div>
                <div class="input-group">
                    <label for="paciente">Paciente</label>
                    <select id="paciente" name="paciente" required>
                      {% for pacient in pacients %}
                      <option value="{{pacient.id}}" {% if note.uuid == pacient.id %}selected{% endif %}>{{ pacient.Nome }} {{pacient.Sobrenome}}</option>
                      {% endfor %}
                    </select>
                </div>
                <div class="input-group">
                    <button type="submit" class="btn primary">Atualizar</button>
                </div>
                <div class="input-group">
                    <a href="/delete_event/{{ note.id }}" class="btn delete-btn">Excluir</a>
                </div>
            </form>
        </div>
      </div>      
        <Script>
            $(document).ready(function() {
                $('#popupPacient').css('display', 'flex');
                $('#summernote').summernote({
                        lang: 'pt-BR',
                        placeholder: 'Pronto para digitar...',
                        tabsize: 2,
                        height: 200,
                        minHeight:null,
                        maxHeight: null,
                    });
                });
        </Script>
  </body>
</html>
