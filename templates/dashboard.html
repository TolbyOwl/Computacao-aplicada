<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="static\dashboard.css">
</head>
<body>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">Logo</div>

    <div class="menu">
      <div class="item active">Menu 1</div>
      <div class="item">Menu 2</div>
      <div class="item">Menu 3</div>
      <div class="item">Menu 4</div>
    </div>

    <div class="config">Config</div>
  </aside>

  <!-- Conteúdo -->
  <main class="main">

    <!-- Linha superior -->
    <div class="top-row">
      <div class="welcome">SAUDAÇÃO & DATA</div>
      <div class="notifications">SOLICITAÇÕES PENDENTES</div>
    </div>

    <!-- Próxima sessão -->
    <div class="next-session">
      BLOCO PRÓXIMA SESSÃO (DESTAQUE VISUAL)
    </div>

    <!-- Parte inferior -->
    <div class="bottom">

      <!-- Agenda -->
      <div class="agenda">
        <h4>AGENDA DE HOJE</h4>

        <div class="event online">ITEM: SESSÃO ONLINE</div>
        <div class="event done">ITEM: SESSÃO CONCLUÍDA</div>
        <div class="event urgent">ITEM: URGÊNCIA</div>
      </div>

      <!-- Resumo -->
      <div class="summary">
        RESUMO DO DIA (CARDS)
      </div>

    </div>

  </main>

</div>

</body>
</html>
