<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Senha</title>
  <link rel="stylesheet" href="static\login_type.css">
</head>
<body>

  <div class="container">
    
    <!-- Lado esquerdo -->
    <div class="left">
      <p>ESPAÇO PARA IMAGEM<br>RECUPERAÇÃO DE SENHA</p>
    </div>

    <!-- Lado direito -->
    <div class="right">
      <h2>Recuperar Senha</h2>
      <p class="subtitle">Enviaremos as instruções para seu email.</p>

      <div class="form-box">
        <p class="form-title">FORMULÁRIO DE RECUPERAÇÃO</p>

        <input type="email" placeholder="Campo Email de Recuperação">

        <button>Enviar Instruções</button>
      </div>

      <p class="login-link">Voltar para o Login</p>
    </div>

  </div>

</body>
</html>
