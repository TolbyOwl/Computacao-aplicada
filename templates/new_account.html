<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta</title>
  <link rel="stylesheet" href="static\login_type.css">
</head>
<body>

  <div class="container">
    
    <!-- Lado esquerdo -->
    <div class="left">
      <img src="static\imgs\forms.jpg" alt="forms_img">
    </div>

    <!-- Lado direito -->
    <div class="right">
      <h2>Criar Nova Conta</h2>
      <p class="subtitle">Junte-se à Giovanna e Amigos</p>

      <div class="form-box">
        <p class="form-title">FORMULÁRIO DE CADASTRO</p>
        <form method="post">
          <input type="text" name="name" placeholder="Nome" required>
          <input type="text" name="lastname" placeholder="Sobrenome" required>
          <input type="text" name="crp" placeholder="CRP" required>                
          <input type="email" name="email" placeholder="Campo Email" required>
          <input type="password" name="password" placeholder="Campo Senha" required>
          <input type="password" name="confirm_password" placeholder="Confirmação de Senha" required>

          <button type="submit">Criar Conta</button>
        </form>
      </div>

      <a href="{{ url_for('login') }}" class="login-link">Já tenho uma conta</a>
    </div>

  </div>

</body>
</html>
