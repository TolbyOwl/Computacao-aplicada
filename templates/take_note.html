<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nota</title>
  <link rel="stylesheet" href="static\take_note.css">
  <link rel="stylesheet" href="static\dashboard.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>

    <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs4.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs4.min.js"></script>

</head>
<body>

<div class="layout">

  <!-- Lado esquerdo -->
  <aside class="sidebar">
    <div class="logo">Logo</div>

    <div class="menu">
      <div class="item"><a href="/dashboard"><i class="bi-house"></i></a></div>
      <div class="item"><a href="/clients"><i class="bi-people"></i></a></div>
      <div class="item active"><a href="/notes"><i class="bi-sticky"></i></a></div>
      <div class="config"><a href="/autenticar_agenda"><i class="bi bi-google"></i></a></div>
    </div>


    <div class="config"><a href="/logout"><i class="bi bi-box-arrow-left"></i></a></div>
  </aside>

  <!-- Conteúdo -->
  <main class="main">

    <!-- Abas -->
    <div class="tabs">
      <div class="tab active">Aba: anotação</div>
      <div class="tab">Aba: consulta</div>
      <div class="tab">Aba: próxima</div>
    </div>

    <!-- Área principal -->
    <div class="content">
      <form method="post" style="display: flex; width: 100%; height: 100%; margin: 0 auto;">
        <textarea id="summernote" name="editordata"></textarea>
      </form>

    </div>

    <!-- Histórico -->
    <div class="history">
      HISTÓRICO - ANOTAÇÕES
    </div>

  </main>

</div>

    <script>
      $('#summernote').summernote({
        lang: 'pt-BR',
        placeholder: 'Pronto para digitar...',
        tabsize: 2,
        height: 650,
        minHeight:null,
        maxHeight: null,
      });
    </script>

</body>
</html>
