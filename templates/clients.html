        <!-- Cards -->
        <div class="cards" id="cardsContainer">
          {% for pacient in pacients %}
          <div class="card patient-card open-pacient-btn" data-status="{{ pacient.Status }}" data-event-id="{{ pacient.id }}">
            <div class="card-header">
              <!-- Avatar -->
              <div class="avatar">JM</div>
              <div class="patient-info">
                <h3 class="patient-name">{{ pacient.Nome }} {{pacient.Sobrenome}}</h3>
                <span class="status {{pacient.Status}}">{{pacient.Status}}</span>
              </div>
            </div>

            <div class="sessions">
              <div class="session-info">
                <span>Última Sessão</span><span>08/05/2026</span>
              </div>
              <div class="session-info">
                <span>Próxima Sessão</span><span>15/05/2026</span>
              </div>
            </div>
          </div>
          {% endfor %}

              </div>
              <a href="#">Ver Perfil <i class="ri-arrow-right-line"></i></a>
            </div>
          </div>

          
          {% for pacient in pacient_pending %}

          <!-- Card Adicionar Novo -->
          <div class="card add" id="openPopupBtn" >
            <i class="ri-add-circle-line"></i>
            <p>Adicionar Novo</p>
          </div>
        </div>
      </main>

    </div>
      <!--Form para novo cliente-->
      <div id="popupForm" class="popup-form">
        <div class="form-content">
            <span class="close-btn" id="closePopupBtn">&times;</span>
            <h2>Novo paciente</h2>
            <form id="popupContactForm" method="post">
                <div class="input-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label for="last_name">Sobrenome</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>
                <div class="input-group">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" placeholder="Ex: (11) 9 0000-0000" required>
                </div>
                <div class="input-group">
                    <label for="telefone">Telefone adicional</label>
                    <input id="telefone_adicional" name="telefone_adicional" placeholder="Ex: (11) 9 0000-0000" required>
                </div>
                <div class="input-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                      <option value="ativo">ativo</option>
                      <option value="em pausa">em pausa</option>
                      <option value="alta">alta</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="message">Informações adicionais</label>
                    <textarea id="additional-info" name="additional-info"></textarea>
                </div>
                <button type="submit" class="btn">Adicionar</button>
            </form>
        </div>
      </div>

    <script src="static/clients.js"></script>
    <script src="{{ url_for('static', filename='phone_mask.js') }}"></script>
