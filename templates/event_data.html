<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Paciente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='clients.css') }}" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  </head>
  <body>

      <!--Detalhes do evento-->
      <div id="popupPacient" class="popup-form-edit">
        <div class="form-content">
            <a href="/dashboard"><span class="close-btn" id="closePacientBtn">&times;</span></a>
            <h2>Editar evento</h2>
            <form id="popupContactForm" method="post">
                <div class="input-group">
                    <input type="text" id="summary" name="summary" value="{{ event.summary }}" required>
                </div>
                <div class="input-group">
                    <input type="date" id="date" name="date" value="{{ event.start.dateTime.split('T')[0] }}" required>
                </div>
                <div class="input-group">
                    <input type="time" id="time" name="time" value="{{ event.start.dateTime.split('T')[1][:5] }}" required>
                </div>
                <div class="input-group">
                    <button type="submit" class="btn">Atualizar</button>
                </div>
                <div class="input-group">
                    <a href="/delete_event/{{ event.id }}" class="btn delete-btn">Excluir</a>
                </div>
            </form>
        </div>
      </div>      
  </body>
</html>
