<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- Lado esquerdo -->
    <div class="left">
      <p>ESPAÇO PARA IMAGEM</p>
    </div>

    <!-- Lado direito -->
    <div class="right">

      <!-- Abas -->
      <div class="tabs">
        <span class="active">Aba Paciente</span>
        <span>Aba Psicólogo</span>
      </div>

      <div class="form-box">
        <p class="form-title">FORMULÁRIO DE LOGIN</p>

        <input type="email" placeholder="Campo Email">
        <input type="password" placeholder="Campo Senha">

        <!-- Linha checkbox -->
        <div class="form-options">
          <label>
            <input type="checkbox"> Lembrar
          </label>
          <a href="recuperar.html">Esqueci a senha</a>
        </div>

        <button>Entrar</button>
      </div>

    </div>

  </div>

</body>
</html>
